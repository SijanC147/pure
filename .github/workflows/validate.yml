name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Pure validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '11.25.0'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: pnpm --ignore-workspace install --frozen-lockfile --ignore-scripts
      - run: npm run test:unit && npx tsc --noEmit
      - run: node --test scripts/homebrew-release.test.mts
      - run: npm run test:pty
      - run: npm run test:package
      - run: npm run test:release

  minimum-zsh:
    name: Pure validation (zsh 5.2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build pinned minimum supported zsh
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error https://www.zsh.org/pub/old/zsh-5.2.tar.xz -o zsh-5.2.tar.xz
          echo 'f17916320ffaa844bbd7ce48ceeb5945fc5f3eff64b149b4229bbfbdf3795a9d  zsh-5.2.tar.xz' | sha256sum --check
          tar -xf zsh-5.2.tar.xz
          cd zsh-5.2
          # Hosted build steps have no controlling tty; Linux supports tcsetpgrp.
          ./configure --with-tcsetpgrp --prefix="$RUNNER_TEMP/zsh-minimum"
          make -j2
          make install.bin install.modules install.fns
          echo "$RUNNER_TEMP/zsh-minimum/bin" >> "$GITHUB_PATH"
      - run: zsh --version && npm run test:unit && npm run test:pty && npm run test:package && npm run test:release
